name: Build and publish AUR release
on:
  workflow_dispatch:
  push:
    branches: [main, automation/update-release]
    paths: ['packaging/**', '.github/**']
permissions:
  contents: read
concurrency:
  group: aur-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        package: [meetily, meetily-cuda, meetily-vulkan, meetily-hipblas, meetily-openblas, meetily-openmp]
    defaults:
      run:
        working-directory: packaging/${{ matrix.package }}
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      AMDGPU_TARGETS: gfx1100
      CMAKE_CUDA_ARCHITECTURES: '75;120'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 180
    steps:
      - name: Install release tools
        working-directory: /tmp
        run: pacman -Syu --noconfirm --needed git python sccache
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate committed recipe
        run: |
          runuser -u builder -- python ../../.github/scripts/update-release.py --self-test
          runuser -u builder -- makepkg --printsrcinfo > /tmp/generated-srcinfo
          diff -u .SRCINFO /tmp/generated-srcinfo
      - name: Install build dependencies and freeze publication files
        shell: bash
        run: |
          mapfile -t deps < <(awk '$1 == "depends" || $1 == "makedepends" || $1 == "checkdepends" {print $3}' .SRCINFO)
          pacman -S --noconfirm --needed "${deps[@]}"
          mkdir /verified
          cp PKGBUILD .SRCINFO *.patch meetily.desktop /verified/
          chmod -R a-w /verified
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/builder/.cache/sccache
          key: arch-sccache-v1-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: arch-sccache-v1-${{ matrix.package }}-
      - name: Set compiler cache ownership
        run: |
          install -d -o builder -g builder /home/builder/.cache/sccache
          chown -R builder:builder /home/builder/.cache/sccache
      - name: Build and test without publication credentials
        id: build
        run: |
          runuser -u builder -- env -i HOME=/home/builder PATH=/usr/bin:/bin TERM=xterm-256color \
            CARGO_BUILD_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2 AMDGPU_TARGETS=gfx1100 \
            CMAKE_CUDA_ARCHITECTURES='75;120' CARGO_INCREMENTAL=0 RUSTC_WRAPPER=/usr/bin/sccache \
            CMAKE_C_COMPILER_LAUNCHER=sccache CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            CMAKE_CUDA_COMPILER_LAUNCHER=sccache CMAKE_HIP_COMPILER_LAUNCHER=sccache \
            SCCACHE_DIR=/home/builder/.cache/sccache SCCACHE_CACHE_SIZE=1G \
            SCCACHE_IGNORE_SERVER_IO_ERROR=1 makepkg --cleanbuild --check --noconfirm
      - name: Show compiler cache statistics
        if: always() && steps.build.outcome != 'skipped'
        run: runuser -u builder -- env SCCACHE_DIR=/home/builder/.cache/sccache sccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-${{ matrix.package }}
          path: /verified/
          include-hidden-files: true
          retention-days: 7
  report:
    needs: build
    if: always() && github.ref == 'refs/heads/automation/update-release'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Show build result on the update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATE: ${{ needs.build.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$BUILD_STATE" -f context='Package build and tests' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Automatic package build and test result'
  merge:
    needs: [build, report]
    if: github.ref == 'refs/heads/automation/update-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge only the tested update commit
        run: |
          set -eu
          gh pr merge automation/update-release --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$GITHUB_SHA"
          # A merge made with GITHUB_TOKEN does not trigger the main push workflow.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
  publish:
    strategy:
      matrix:
        package: [meetily, meetily-cuda, meetily-vulkan, meetily-hipblas, meetily-openblas, meetily-openmp]
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-${{ matrix.package }}
          path: verified
      - name: Publish verified recipe to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          if [ "$GITHUB_SHA" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
            echo 'A newer main revision exists; skipping superseded publication.'
            exit 0
          fi
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          export GIT_SSH_COMMAND="ssh -i $key_dir/key -o IdentityAgent=none -o IdentitiesOnly=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/aur-known-hosts -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/${{ matrix.package }}.git "$key_dir/aur"
          cp verified/* verified/.SRCINFO "$key_dir/aur/"
          cd "$key_dir/aur"
          git add PKGBUILD .SRCINFO *.patch meetily.desktop
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update tested Meetily package'
            git push origin HEAD:master
          fi
